<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Architect | Complete Entry Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #fcfbf7; font-family: 'Montserrat', sans-serif; color: #2d2a26; }
        .input-box { border: 1px solid #e2ded5; padding: 10px; width: 100%; margin-bottom: 10px; background: white; font-size: 12px; }
        label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.6; display: block; margin-bottom: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-6xl mx-auto">
        <!-- Return Link -->
        <a href="index.html" class="text-[9px] uppercase tracking-widest text-stone-400 hover:text-[#8d5d46] transition-colors mb-4 block">← Return to Main Site</a>
        
        <h1 class="text-3xl italic mb-10 text-[#8d5d46]">Data Architect — Entry Manager</h1>

        <!-- Add / Edit Destination Section -->
        <div class="mb-12 p-8 bg-white border border-stone-200" id="destination-form-container">
            <h3 id="form-title" class="font-bold text-xs uppercase mb-4">Add New Destination</h3>
            <input type="hidden" id="editTripId">
            <input type="text" id="newTripName" placeholder="Trip Name (e.g., Colorado)" class="input-box">
            <input type="text" id="newCountryName" placeholder="Country/Region" class="input-box">
            <input type="text" id="newPhotoUrl" placeholder="Main Cover Photo URL" class="input-box">
            <div class="flex space-x-2">
                <button id="createTripBtn" class="bg-[#8d5d46] text-white px-8 py-2 text-[10px] uppercase tracking-widest">Create New Trip</button>
                <button id="updateTripBtn" class="bg-black text-white px-8 py-2 text-[10px] uppercase tracking-widest hidden">Save Changes</button>
                <button id="cancelEditBtn" class="border border-stone-300 text-stone-600 px-4 py-2 text-[10px] uppercase tracking-widest hidden">Cancel</button>
            </div>
        </div>

        <!-- Other USA Travel Guides Manager Section -->
        <div class="mb-12 p-8 bg-white border border-stone-200">
            <h3 class="font-bold text-xs uppercase mb-4 text-[#8d5d46]">Manage Homepage: Other USA Travel Guides</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="oguide_title" placeholder="Guide Title (e.g., 14 Stunning Sights in Death Valley)" class="input-box md:col-span-3">
                <input type="text" id="oguide_photo" placeholder="Photo Image URL" class="input-box">
                <input type="text" id="oguide_link" placeholder="Destination/Page Link URL" class="input-box md:col-span-2">
            </div>
            <button id="addOtherGuideBtn" class="bg-[#8d5d46] text-white px-8 py-2 text-[10px] uppercase tracking-widest mt-2">Add Travel Guide Card</button>
            <div id="other-guides-admin-list" class="mt-6 space-y-2 border-t pt-4"></div>
        </div>

        <!-- Existing Trips List Grid -->
        <div class="mb-4 font-bold text-xs uppercase tracking-wider text-stone-500">Existing Destinations</div>
        <div id="archive-list" class="mb-10 space-y-2"></div>

        <!-- Rich Content & Entry Manager (Hidden by default) -->
        <div id="itinerary-editor" class="hidden bg-white p-10 border border-stone-200 shadow-sm">
            <div class="flex justify-between items-center mb-8">
                <h2 id="selected-trip-name" class="text-2xl italic text-[#8d5d46]"></h2>
                <button onclick="document.getElementById('itinerary-editor').classList.add('hidden')" class="text-stone-400 text-[9px] uppercase tracking-widest border px-3 py-1">Close Editor</button>
            </div>
            
            <!-- Append / Manage Itinerary Days -->
            <div class="mb-10 p-6 bg-stone-50 border border-stone-200">
                <h3 class="font-bold text-xs uppercase mb-4">Manage & Append Itinerary Days</h3>
                <input type="text" id="dayTitle" placeholder="Day Title (e.g., Arrival in the Valley)" class="input-box">
                <textarea id="dayContent" placeholder="Day details..." class="input-box h-20"></textarea>
                <button id="addDayBtn" class="bg-black text-white px-6 py-2 text-[10px] uppercase mb-4">Add New Day</button>
                <div id="days-admin-list" class="space-y-2 border-t pt-4"></div>
            </div>

            <!-- Manage Destination Travel Guides (Right after Itinerary Schedule) -->
            <div class="mb-10 p-6 bg-stone-50 border border-stone-200">
                <h3 class="font-bold text-xs uppercase mb-4 text-[#8d5d46]">Manage Destination Travel Guides (Compass Section)</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="dt_guide_title" placeholder="Guide Title" class="input-box md:col-span-3">
                    <input type="text" id="dt_guide_photo" placeholder="Photo Image URL" class="input-box">
                    <input type="text" id="dt_guide_link" placeholder="Destination/Page Link URL" class="input-box md:col-span-2">
                </div>
                <button id="addDestinationGuideBtn" class="bg-[#8d5d46] text-white px-8 py-2 text-[10px] uppercase tracking-widest mt-2">Add Destination Travel Guide</button>
                <div id="destination-guides-admin-list" class="mt-6 space-y-2 border-t pt-4"></div>
            </div>

            <!-- Tab Entry Managers (Compass, Chronicles, Corners) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Compass Entries -->
                <div class="p-4 bg-stone-50 border border-stone-200 space-y-3">
                    <h3 class="font-bold text-xs uppercase border-b pb-2 text-[#8d5d46]">Compass Entries</h3>
                    <input type="text" id="c_title" class="input-box" placeholder="Entry Title">
                    <textarea id="c_text" class="input-box h-16" placeholder="Notes/Story..."></textarea>
                    <input type="text" id="c_photo" class="input-box" placeholder="Photo URL">
                    <input type="text" id="c_link" class="input-box" placeholder="Link URL">
                    <input type="text" id="c_caption" class="input-box" placeholder="Caption">
                    <button id="addCompassBtn" class="bg-[#8d5d46] text-white w-full py-2 text-[9px] uppercase tracking-wider">Add Compass Entry</button>
                    <div id="compass-entries-list" class="space-y-2 pt-4 border-t"></div>
                </div>

                <!-- Chronicles Entries -->
                <div class="p-4 bg-stone-50 border border-stone-200 space-y-3">
                    <h3 class="font-bold text-xs uppercase border-b pb-2 text-[#8d5d46]">Chronicles Entries</h3>
                    <input type="text" id="ch_title" class="input-box" placeholder="Entry Title">
                    <textarea id="ch_text" class="input-box h-16" placeholder="Story text..."></textarea>
                    <input type="text" id="ch_photo" class="input-box" placeholder="Photo URL">
                    <input type="text" id="ch_link" class="input-box" placeholder="Link URL">
                    <input type="text" id="ch_caption" class="input-box" placeholder="Caption">
                    <button id="addChroniclesBtn" class="bg-[#8d5d46] text-white w-full py-2 text-[9px] uppercase tracking-wider">Add Chronicle Entry</button>
                    <div id="chronicles-entries-list" class="space-y-2 pt-4 border-t"></div>
                </div>

                <!-- Corners Entries -->
                <div class="p-4 bg-stone-50 border border-stone-200 space-y-3">
                    <h3 class="font-bold text-xs uppercase border-b pb-2 text-[#8d5d46]">Corners Entries</h3>
                    <input type="text" id="co_title" class="input-box" placeholder="Entry Title">
                    <textarea id="co_text" class="input-box h-16" placeholder="Guide notes..."></textarea>
                    <input type="text" id="co_photo" class="input-box" placeholder="Photo URL">
                    <input type="text" id="co_link" class="input-box" placeholder="Link URL">
                    <input type="text" id="co_caption" class="input-box" placeholder="Caption">
                    <button id="addCornersBtn" class="bg-[#8d5d46] text-white w-full py-2 text-[9px] uppercase tracking-wider">Add Corner Entry</button>
                    <div id="corners-entries-list" class="space-y-2 pt-4 border-t"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://latitudesandlongitudes-3f37b-default-rtdb.firebaseio.com" }));
        let activeId = null;
        let cachedDestinations = {};

        // Load Homepage Other USA Travel Guides
        onValue(ref(db, 'other_usa_guides'), (snapshot) => {
            const guides = snapshot.val();
            const container = document.getElementById('other-guides-admin-list');
            container.innerHTML = guides ? Object.keys(guides).map(k => `
                <div class="flex justify-between items-center bg-stone-50 p-2 border text-xs">
                    <span class="truncate max-w-[400px]"><strong>${guides[k].title || 'Untitled'}</strong></span>
                    <button onclick="window.removeGlobalItem('other_usa_guides', '${k}')" class="text-red-500 uppercase text-[9px] font-bold">Delete</button>
                </div>
            `).join('') : `<span class="text-stone-400 text-xs italic">No travel guide cards added yet.</span>`;
        });

        document.getElementById('addOtherGuideBtn').onclick = async () => {
            const title = document.getElementById('oguide_title').value;
            const photo = document.getElementById('oguide_photo').value;
            const link = document.getElementById('oguide_link').value;
            if (!title) return alert("Please enter a guide title.");
            await push(ref(db, 'other_usa_guides'), { title, photo, link });
            document.getElementById('oguide_title').value = '';
            document.getElementById('oguide_photo').value = '';
            document.getElementById('oguide_link').value = '';
            alert("Travel guide card added successfully!");
        };

        window.removeGlobalItem = async (path, key) => {
            if (confirm("Delete this travel guide card?")) {
                await remove(ref(db, `${path}/${key}`));
            }
        };

        // 1. Load Destinations List
        onValue(ref(db, 'itineraries'), (snapshot) => {
            const data = snapshot.val();
            cachedDestinations = data || {};
            const list = document.getElementById('archive-list');
            if (data) {
                list.innerHTML = Object.keys(data).map(key => `
                    <div class="flex justify-between items-center p-4 bg-white border border-stone-200">
                        <span class="font-medium">${data[key].name || 'Unnamed'} <span class="text-xs text-stone-400">(${data[key].country || ''})</span></span>
                        <div class="space-x-3">
                            <button onclick="window.openEditor('${key}', '${data[key].name || ''}')" class="text-blue-600 uppercase text-[9px] font-bold">Manage Entries</button>
                            <button onclick="window.startEditTrip('${key}')" class="text-amber-600 uppercase text-[9px] font-bold">Edit Destination</button>
                            <button onclick="window.deleteTrip('${key}')" class="text-red-600 uppercase text-[9px] font-bold">Delete Trip</button>
                        </div>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `<p class="text-xs text-stone-400 italic">No destinations found. Create one above.</p>`;
            }
        });

        // 2. Create Trip
        document.getElementById('createTripBtn').onclick = async () => {
            const name = document.getElementById('newTripName').value;
            const country = document.getElementById('newCountryName').value;
            const photo = document.getElementById('newPhotoUrl').value;
            if (!name || !country) return alert("Please enter both a trip name and country/region.");
            
            await push(ref(db, 'itineraries'), { name, country, photo });
            resetTripForm();
            alert("Destination created successfully!");
        };

        // 2b. Edit / Update Trip Prep & Action
        window.startEditTrip = (id) => {
            const trip = cachedDestinations[id];
            if (!trip) return;
            document.getElementById('form-title').innerText = "Edit Destination: " + (trip.name || '');
            document.getElementById('editTripId').value = id;
            document.getElementById('newTripName').value = trip.name || '';
            document.getElementById('newCountryName').value = trip.country || '';
            document.getElementById('newPhotoUrl').value = trip.photo || '';
            
            document.getElementById('createTripBtn').classList.add('hidden');
            document.getElementById('updateTripBtn').classList.remove('hidden');
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        document.getElementById('cancelEditBtn').onclick = () => {
            resetTripForm();
        };

        document.getElementById('updateTripBtn').onclick = async () => {
            const id = document.getElementById('editTripId').value;
            const name = document.getElementById('newTripName').value;
            const country = document.getElementById('newCountryName').value;
            const photo = document.getElementById('newPhotoUrl').value;
            if (!id || !name || !country) return alert("Please enter both a trip name and country/region.");

            await update(ref(db, `itineraries/${id}`), { name, country, photo });
            if (activeId === id) {
                document.getElementById('selected-trip-name').innerText = "Managing Entries For: " + name;
            }
            resetTripForm();
            alert("Destination updated successfully!");
        };

        function resetTripForm() {
            document.getElementById('form-title').innerText = "Add New Destination";
            document.getElementById('editTripId').value = '';
            document.getElementById('newTripName').value = '';
            document.getElementById('newCountryName').value = '';
            document.getElementById('newPhotoUrl').value = '';
            document.getElementById('createTripBtn').classList.remove('hidden');
            document.getElementById('updateTripBtn').classList.add('hidden');
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        // 3. Open Editor and Load All Sub-lists (Days, Destination Travel Guides, Compass, Chronicles, Corners)
        window.openEditor = (id, name) => {
            activeId = id;
            document.getElementById('itinerary-editor').classList.remove('hidden');
            document.getElementById('selected-trip-name').innerText = "Managing Entries For: " + name;

            // Load Itinerary Days
            onValue(ref(db, `itineraries/${id}/days`), (snapshot) => {
                const days = snapshot.val();
                const container = document.getElementById('days-admin-list');
                container.innerHTML = days ? Object.keys(days).map((k, idx) => `
                    <div class="flex justify-between items-center bg-white p-2 border text-xs">
                        <span><strong>Day ${idx+1}:</strong> ${days[k].title}</span>
                        <button onclick="window.removeItem('${id}/days', '${k}')" class="text-red-500 uppercase text-[9px] font-bold">Delete</button>
                    </div>
                `).join('') : `<span class="text-stone-400 text-xs italic">No days added.</span>`;
            });

            // Load Destination-Specific Travel Guides
            onValue(ref(db, `itineraries/${id}/other_guides`), (snapshot) => {
                const guides = snapshot.val();
                const container = document.getElementById('destination-guides-admin-list');
                container.innerHTML = guides ? Object.keys(guides).map(k => `
                    <div class="flex justify-between items-center bg-white p-2 border text-xs">
                        <span class="truncate max-w-[400px]"><strong>${guides[k].title || 'Untitled'}</strong></span>
                        <button onclick="window.removeItem('${id}/other_guides', '${k}')" class="text-red-500 uppercase text-[9px] font-bold">Delete</button>
                    </div>
                `).join('') : `<span class="text-stone-400 text-xs italic">No travel guides added for this destination yet.</span>`;
            });

            // Load Compass Entries
            onValue(ref(db, `itineraries/${id}/grids/compass`), (snapshot) => {
                const items = snapshot.val();
                const container = document.getElementById('compass-entries-list');
                container.innerHTML = items ? Object.keys(items).map(k => `
                    <div class="flex justify-between items-center bg-white p-2 border text-xs">
                        <span class="truncate max-w-[150px]">${items[k].title || items[k].text || 'Photo Entry'}</span>
                        <button onclick="window.removeItem('${id}/grids/compass', '${k}')" class="text-red-500 uppercase text-[9px] font-bold">Delete</button>
                    </div>
                `).join('') : `<span class="text-stone-400 text-xs italic">No compass entries.</span>`;
            });

            // Load Chronicles Entries
            onValue(ref(db, `itineraries/${id}/grids/chronicles`), (snapshot) => {
                const items = snapshot.val();
                const container = document.getElementById('chronicles-entries-list');
                container.innerHTML = items ? Object.keys(items).map(k => `
                    <div class="flex justify-between items-center bg-white p-2 border text-xs">
                        <span class="truncate max-w-[150px]">${items[k].title || items[k].text || 'Photo Entry'}</span>
                        <button onclick="window.removeItem('${id}/grids/chronicles', '${k}')" class="text-red-500 uppercase text-[9px] font-bold">Delete</button>
                    </div>
                `).join('') : `<span class="text-stone-400 text-xs italic">No chronicle entries.</span>`;
            });

            // Load Corners Entries
            onValue(ref(db, `itineraries/${id}/grids/corners`), (snapshot) => {
                const items = snapshot.val();
                const container = document.getElementById('corners-entries-list');
                container.innerHTML = items ? Object.keys(items).map(k => `
                    <div class="flex justify-between items-center bg-white p-2 border text-xs">
                        <span class="truncate max-w-[150px]">${items[k].title || items[k].text || 'Photo Entry'}</span>
                        <button onclick="window.removeItem('${id}/grids/corners', '${k}')" class="text-red-500 uppercase text-[9px] font-bold">Delete</button>
                    </div>
                `).join('') : `<span class="text-stone-400 text-xs italic">No corner entries.</span>`;
            });
        };

        // 4. Add Sub-Items (Push to lists instead of overwriting)
        document.getElementById('addDayBtn').onclick = async () => {
            if (!activeId) return;
            const title = document.getElementById('dayTitle').value;
            const content = document.getElementById('dayContent').value;
            if (!title || !content) return alert("Fill out day title and content.");
            await push(ref(db, `itineraries/${activeId}/days`), { title, content });
            document.getElementById('dayTitle').value = '';
            document.getElementById('dayContent').value = '';
        };

        document.getElementById('addDestinationGuideBtn').onclick = async () => {
            if (!activeId) return;
            const title = document.getElementById('dt_guide_title').value;
            const photo = document.getElementById('dt_guide_photo').value;
            const link = document.getElementById('dt_guide_link').value;
            if (!title) return alert("Please enter a guide title.");
            await push(ref(db, `itineraries/${activeId}/other_guides`), { title, photo, link });
            document.getElementById('dt_guide_title').value = '';
            document.getElementById('dt_guide_photo').value = '';
            document.getElementById('dt_guide_link').value = '';
            alert("Destination travel guide added successfully!");
        };

        document.getElementById('addCompassBtn').onclick = async () => {
            if (!activeId) return;
            await push(ref(db, `itineraries/${activeId}/grids/compass`), {
                title: document.getElementById('c_title').value,
                text: document.getElementById('c_text').value,
                photo: document.getElementById('c_photo').value,
                link: document.getElementById('c_link').value,
                caption: document.getElementById('c_caption').value
            });
            document.getElementById('c_title').value = '';
            document.getElementById('c_text').value = '';
            document.getElementById('c_photo').value = '';
            document.getElementById('c_link').value = '';
            document.getElementById('c_caption').value = '';
        };

        document.getElementById('addChroniclesBtn').onclick = async () => {
            if (!activeId) return;
            await push(ref(db, `itineraries/${activeId}/grids/chronicles`), {
                title: document.getElementById('ch_title').value,
                text: document.getElementById('ch_text').value,
                photo: document.getElementById('ch_photo').value,
                link: document.getElementById('ch_link').value,
                caption: document.getElementById('ch_caption').value
            });
            document.getElementById('ch_title').value = '';
            document.getElementById('ch_text').value = '';
            document.getElementById('ch_photo').value = '';
            document.getElementById('ch_link').value = '';
            document.getElementById('ch_caption').value = '';
        };

        document.getElementById('addCornersBtn').onclick = async () => {
            if (!activeId) return;
            await push(ref(db, `itineraries/${activeId}/grids/corners`), {
                title: document.getElementById('co_title').value,
                text: document.getElementById('co_text').value,
                photo: document.getElementById('co_photo').value,
                link: document.getElementById('co_link').value,
                caption: document.getElementById('co_caption').value
            });
            document.getElementById('co_title').value = '';
            document.getElementById('co_text').value = '';
            document.getElementById('co_photo').value = '';
            document.getElementById('co_link').value = '';
            document.getElementById('co_caption').value = '';
        };

        // 5. General Item Removal
        window.removeItem = async (path, key) => {
            if (confirm("Delete this specific entry?")) {
                await remove(ref(db, `itineraries/${path}/${key}`));
            }
        };

        // 6. Delete Full Trip
        window.deleteTrip = (id) => {
            if (confirm("Permanently delete this destination and all its entries?")) {
                remove(ref(db, `itineraries/${id}`)).then(() => {
                    if (activeId === id) {
                        document.getElementById('itinerary-editor').classList.add('hidden');
                    }
                });
            }
        };
    </script>
</body>
</html>
