<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compass - Narrative Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f1ea; color: #2e2b2a; font-family: 'Montserrat', sans-serif; margin: 0; }
        .serif { font-family: 'Cormorant Garamond', serif; }
        .custom-navbar { position: absolute; top: 0; left: 0; width: 100%; z-index: 9999; display: flex; justify-content: space-between; align-items: center; padding: 40px 50px; box-sizing: border-box; }
        .nav-group { display: flex; gap: 30px; }
        .nav-link { color: #ffffff !important; text-transform: uppercase; font-size: 11px; font-weight: 300; letter-spacing: 0.3em; text-decoration: none; }
    </style>
</head>
<body>

   <header class="custom-navbar">
        <div class="nav-group">
            <a href="index.html" class="nav-link">Home</a>
            <a href="index.html#explorers" class="nav-link">About</a>
            <a href="chronicles.html" class="nav-link" style="color: #c59b85 !important; font-weight: 500;">Blog</a>
            <a href="compass.html" class="nav-link">Places</a>
            <a href="corners.html" class="nav-link">Corners</a>
        </div>
        <a href="index.html" class="serif text-2xl italic text-[#c59b85] lowercase no-underline">l&l</a>
    </header>
    
    <section class="bg-[#c59b85] text-white pt-48 pb-24 px-6 text-center border-b border-[#b08772]">
        <h1 class="serif text-5xl md:text-6xl font-light text-white tracking-wide mb-2">Compass</h1>
        <p class="serif text-lg italic text-[#fdfcf7]/70 font-light">Maps, miles and moments that shape the journey.</p>
    </section>

    <!-- Destination Cards Grid -->
    <section class="max-w-6xl mx-auto px-6 py-32">
        <div id="itinerary-cards-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Loaded dynamically from Firebase -->
        </div>
    </section>

    <!-- Itinerary Modal View (Where Appended Days Appear) -->
    <div id="itinerary-modal" class="hidden fixed inset-0 z-[100] w-full h-full bg-[#fdfcf7] overflow-y-auto">
        <div class="max-w-4xl mx-auto px-6 py-32 relative">
            <button onclick="closeModal()" class="fixed top-12 left-12 md:left-24 flex items-center gap-2 text-[9px] tracking-[0.4em] uppercase text-stone-500 hover:text-black transition-all">
                ← Back to Compass
            </button>
            <div id="modal-content" class="mt-12"></div>
        </div>
    </div>

    <footer class="py-12 text-center bg-[#2e2b2a] text-[#dad4c5] text-[10px] tracking-widest uppercase">
        <a href="index.html" class="hover:text-white">Return Home Cover</a>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAecvrfHyFXRGF3kkr-nL2vEhyIn4tZmU0",
            authDomain: "latitudesandlongitudes-3f37b.firebaseapp.com",
            projectId: "latitudesandlongitudes-3f37b",
            databaseURL: "https://latitudesandlongitudes-3f37b-default-rtdb.firebaseio.com",
            storageBucket: "latitudesandlongitudes-3f37b.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.allTrips = [];

        onValue(ref(db, 'itineraries'), (snapshot) => {
            const data = snapshot.val();
            const cardsGrid = document.getElementById('itinerary-cards-grid');
            
            if (data) {
                window.allTrips = Object.keys(data).map(key => ({...data[key], id: key})).reverse();
                cardsGrid.innerHTML = window.allTrips.map(t => `
                    <div class="flex flex-col cursor-pointer group text-left bg-[#e4dfd5]/40 p-4 border border-[#e4dfd5] transition-all duration-300 hover:bg-[#e4dfd5]/80" onclick="openItinerary('${t.id}')">
                        <div class="w-full h-64 overflow-hidden bg-stone-200 mb-4 shadow-sm relative border border-[#dad4c5]">
                            <img src="${t.photo || ''}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-102 filter sepia-[15%]">
                        </div>
                        <h3 class="serif text-xl text-[#2e2b2a] leading-snug group-hover:text-[#8d5d46] transition-colors mb-1 font-light">${t.name}</h3>
                        <span class="text-[9px] tracking-wider text-stone-500 uppercase font-light">🗺️ ${t.country || 'Route'}</span>
                    </div>
                `).join('');
            } else {
                cardsGrid.innerHTML = `<p class="text-sm text-stone-500 italic">No compass routes added yet.</p>`;
            }
        });

        window.openItinerary = function(tripId) {
            const trip = window.allTrips.find(t => t.id === tripId);
            const modal = document.getElementById('itinerary-modal');
            const content = document.getElementById('modal-content');
            
            if (trip) {
                const compass = trip.grids?.compass || {};

                let html = `
                    <div class="text-center mb-16">
                        <span class="text-[10px] tracking-[0.6em] uppercase text-stone-500">${trip.country || 'Route'}</span>
                        <h2 class="serif text-5xl italic font-light text-[#2e2b2a] mt-2">${trip.name}</h2>
                    </div>

                    ${compass.photo ? `<div class="mb-12"><img src="${compass.photo}" class="w-full max-h-96 object-cover border border-[#dad4c5] p-1 bg-white"></div>` : ''}
                    ${compass.text ? `<p class="max-w-xl mx-auto text-stone-700 italic serif text-xl mb-16 text-center">${compass.text}</p>` : ''}
                    
                    <div class="border-t border-[#dad4c5] pt-16 max-w-xl mx-auto space-y-16">
                        <h3 class="serif text-2xl italic text-stone-400 text-center mb-10">Itinerary Schedule</h3>
                `;

                // Loops through and displays all the Appended Itinerary Days
                if (trip.days) {
                    Object.values(trip.days).forEach((day, index) => {
                        html += `
                            <div class="text-left bg-white/60 p-8 border border-[#dad4c5]">
                                <span class="text-[9px] tracking-[0.3em] uppercase text-[#c59b85] font-semibold block mb-1">Day ${index + 1}</span>
                                <h4 class="serif text-2xl italic text-[#2e2b2a] mb-3">${day.title}</h4>
                                <p class="text-stone-600 font-light text-sm leading-relaxed whitespace-pre-wrap">${day.content}</p>
                            </div>
                        `;
                    });
                } else {
                    html += `<p class="text-center text-stone-400 italic text-sm">No itinerary days appended for this route yet.</p>`;
                }
                
                html += `</div></div>`;
                content.innerHTML = html;
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        };
        
        window.closeModal = () => { 
            document.getElementById('itinerary-modal').classList.add('hidden'); 
            document.body.style.overflow = 'auto'; 
        };
    </script>
</body>
</html>
